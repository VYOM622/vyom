<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cute Photo</title>
    <style>
        body {
            background-color: #F0F8FF; /* Light blue background */
            color: #333333; /* Dark text color for contrast */
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            animation: fadeIn 1s; /* Fade-in animation for the body */
            overflow: hidden; /* Hide overflow for confetti */
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            animation: slideIn 1s; /* Slide-in animation for the heading */
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        img {
            max-width: 50%; /* Adjusted to make the image smaller */
            height: auto;
            border-radius: 10px; /* Rounded corners for the image */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Shadow effect */
            animation: zoomIn 1s; /* Zoom-in animation for the image */
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        p {
            animation: fadeIn 1s; /* Fade-in animation for the paragraph */
        }

        .back-link {
            background-color: #4caf50; /* Green link button */
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s;
            display: inline-block;
            margin: 10px;
            animation: bounce 1s; /* Bounce animation for the back link */
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffcc00; /* Confetti color */
            opacity: 0.8;
            animation: fall 3s infinite; /* Falling animation */
        }

        @keyframes fall {
            0% { transform: translateY(-100px); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
    </style>
</head>
<body>
    <div>
        <h1>Your Cute Photo</h1>
        <img src="C:\Users\user\Desktop\00\12\12.jpg" alt="A cute photo of us!"> <!-- Replace with actual image path -->
        <p>This is one of my favorite memories with you! 💖</p>
        <a href="birthday_wish.html" class="back-link">Back to Birthday Wishes</a>
    </div>

    <!-- Confetti Elements -->
    <div class="confetti" style="left: 10%; animation-delay: 0s;"></div>
    <div class="confetti" style="left: 20%; animation-delay: 0.5s;"></div>
    <div class="confetti" style="left: 30%; animation-delay: 1s;"></div>
    <div class="confetti" style="left: 40%; animation-delay: 1.5s;"></div>
    <div class="confetti" style="left: 50%; animation-delay: 2s;"></div>
    <div class="confetti" style="left: 60%; animation-delay: 2.5s;"></div>
    <div class="confetti" style="left: 70%; animation-delay: 3s;"></div>
    <div class="confetti" style="left: 80%; animation-delay: 3.5s;"></div>
    <div class="confetti" style="left: 90%; animation-delay: 4s;"></div>
</body>
</html>
